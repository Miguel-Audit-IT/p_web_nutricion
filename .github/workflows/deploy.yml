name: Despliegue de Producción a GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Permisos requeridos para publicar en GitHub Pages con HTTPS
permissions:
  contents: read
  pages: write
  id-token: write

# Permite una sola implementación simultánea y cancela ejecuciones obsoletas
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    name: Compilar Proyecto (TypeScript & Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias con npm ci
        run: npm ci

      - name: Construir y optimizar bundle para producción
        run: npm run build

      - name: Cargar artefactos para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    name: Publicar en GitHub Pages (HTTPS)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
